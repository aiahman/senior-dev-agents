<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header with department tabs; a top-down org tree (IT > department > lead > stacked specialists); click any box for a skills drawer. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --fg: #16202e;
  --muted: #5a6678;
  --line: #b9c3d3;
  --dept: #2f5fd0;
  --dept-fg: #ffffff;
  --lead: #8fb0f2;
  --lead-fg: #0f1d38;
  --staff: #dce7fc;
  --staff-fg: #16202e;
  --ring: #1f4fc2;
  --chip: #e8edf5;
  --ok: #1f7a4d; --ok-bg: #dcf3e6;
  --warn: #8a5a00; --warn-bg: #fdf0d2;
  --new: #6b3fb8; --new-bg: #ece3fb;
  --shadow: 0 1px 2px rgba(22,32,46,.08), 0 2px 8px rgba(22,32,46,.06);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #161d28; --fg: #e6ebf3; --muted: #97a3b6; --line: #3a4659;
  --dept: #3f6fe0; --dept-fg: #ffffff; --lead: #2c4a86; --lead-fg: #eef3ff; --staff: #1d2b45; --staff-fg: #dbe5f7;
  --ring: #8fb0f2; --chip: #222c3b;
  --ok: #7fd8a6; --ok-bg: #173527; --warn: #f2c46b; --warn-bg: #3a2e14; --new: #c7a8ff; --new-bg: #2c2147;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #161d28; --fg: #e6ebf3; --muted: #97a3b6; --line: #3a4659;
  --dept: #3f6fe0; --dept-fg: #ffffff; --lead: #2c4a86; --lead-fg: #eef3ff; --staff: #1d2b45; --staff-fg: #dbe5f7;
  --ring: #8fb0f2; --chip: #222c3b;
  --ok: #7fd8a6; --ok-bg: #173527; --warn: #f2c46b; --warn-bg: #3a2e14; --new: #c7a8ff; --new-bg: #2c2147;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.head-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 14px 8px }
h1 { font-family: var(--display); font-size: 1.35rem; margin: 0; letter-spacing: -.01em; text-wrap: balance }
.counts { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 4px 12px; scrollbar-width: thin }
.tab { flex: none; font: 500 .82rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap }
.tab:hover { border-color: var(--ring) }
.tab[aria-selected="true"] { background: var(--dept); border-color: var(--dept); color: var(--dept-fg) }
.tab:focus-visible, .node:focus-visible, .zbtn:focus-visible, .close:focus-visible, .agent:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px }

main { padding-block: 18px 48px }
.intro { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; margin-bottom: 14px }
.intro p { margin: 0; color: var(--muted); max-width: 70ch }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .78rem; color: var(--muted); align-items: center }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line) }
.zoom { display: flex; gap: 6px; align-items: center }
.zbtn { font: 500 .78rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 5px 10px; border-radius: 6px; cursor: pointer }
.zbtn[aria-pressed="true"] { border-color: var(--ring); color: var(--ring) }

.canvas { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 16px 32px }
.tree { width: max-content; margin: 0 auto }

/* CSS tree connectors */
.tree ul { display: flex; justify-content: center; padding: 28px 0 0; margin: 0; list-style: none; position: relative }
.tree > ul { padding-top: 0 }
.tree li { position: relative; padding: 28px 10px 0; display: flex; flex-direction: column; align-items: center }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 28px; border-top: 2px solid var(--line) }
.tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line) }
.tree li:only-child::before, .tree li:only-child::after { display: none }
.tree li:only-child { padding-top: 0 }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none }
.tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 8px 0 0 }
.tree li:first-child::after { border-radius: 8px 0 0 0 }
.tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 28px; border-left: 2px solid var(--line) }
.tree > ul > li::before, .tree > ul > li::after { display: none }

.node { width: 176px; min-height: 132px; padding: 12px 10px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; cursor: pointer; font: inherit; color: inherit; position: relative }
.node:hover { outline: 2px solid var(--ring); outline-offset: 1px }
.node .nm { font-weight: 600; font-size: .88rem; line-height: 1.2 }
.node .rl { font-size: .8rem; line-height: 1.25 }
.n-root { background: var(--surface); border: 2px solid var(--line); width: 200px }
.n-root .nm { font-family: var(--display); font-size: 1rem; letter-spacing: .04em; text-transform: uppercase }
.n-dept { background: var(--dept); color: var(--dept-fg) }
.n-dept .nm { font-family: var(--display); font-size: .92rem; letter-spacing: .02em }
.n-dept .rl { opacity: .85 }
.n-lead { background: var(--lead); color: var(--lead-fg) }
.n-staff { background: var(--staff); color: var(--staff-fg); min-height: 0; padding: 10px; flex-direction: row; justify-content: flex-start; text-align: left; width: 100% }
.n-staff .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.n-staff .rl { font-weight: 600; font-size: .8rem }
.n-staff .sk { font-size: .72rem; opacity: .75 }

.photo { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 600 .95rem var(--display); background: var(--surface); color: var(--muted); border: 2px dashed var(--line) }
.n-dept .photo { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.55); color: var(--dept-fg) }
.n-lead .photo { border-color: var(--lead-fg); color: var(--lead-fg); background: rgba(255,255,255,.35) }
.n-staff .photo { width: 34px; height: 34px; font-size: .7rem; background: var(--surface) }
.photo svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 1.6 }

/* lead + stacked specialists */
.unit { width: 196px; display: flex; flex-direction: column }
.unit .n-lead { width: 196px }
.tree ul.staff { list-style: none; margin: 0; padding: 0 0 0 24px; justify-content: flex-start; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; position: relative }
.tree ul.staff::before { display: none }
.tree .staff li { padding: 0; display: block; position: relative }
.tree .staff li::before { content: ""; position: absolute; display: block; left: -12px; top: 50%; width: 12px; height: 0; border: 0; border-top: 2px solid var(--line); border-radius: 0 }
.tree .staff li::after { content: ""; position: absolute; display: block; left: -12px; top: -12px; width: 0; height: calc(100% + 12px); border: 0; border-left: 2px solid var(--line); border-radius: 0 }
.tree .staff li:first-child::after { top: -20px; height: calc(100% + 20px) }
.tree .staff li:last-child::after { height: calc(50% + 12px) }
.tree .staff li:first-child:last-child::after { height: calc(50% + 20px) }

/* department directory */
.dir { margin-top: 26px; display: grid; gap: 14px }
.dir h2 { font-family: var(--display); font-size: 1.1rem; margin: 0 }
.dir .sub { color: var(--muted); margin: 0 }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.team-head { padding: 12px 16px; background: var(--lead); color: var(--lead-fg); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline }
.team-head b { font-family: var(--display) }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--surface) }
.agent { background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 12px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer }
.agent:hover { background: var(--chip) }
.agent .rl { font-weight: 600 }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { font: 500 .72rem var(--body); padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--fg); overflow-wrap: anywhere }
.chip.c-Candidate { background: var(--new-bg); color: var(--new) }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,15,25,.35); z-index: 20 }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.15); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
.d-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center }
.d-head .photo { width: 56px; height: 56px }
.d-head h3 { margin: 0; font-family: var(--display); font-size: 1.1rem }
.d-head p { margin: 2px 0 0; color: var(--muted); font-size: .85rem }
.close { margin-left: auto; align-self: flex-start; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit }
.d-body { padding: 16px 20px 24px; overflow-y: auto; display: grid; gap: 14px; align-content: start }
.d-label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 }
.skill { display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px }
.skill .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.skill code { font: 600 .82rem ui-monospace, "SFMono-Regular", Menlo, monospace; overflow-wrap: anywhere }
.skill p { margin: 0; color: var(--muted); font-size: .84rem }
.st { font: 600 .68rem var(--body); padding: 2px 7px; border-radius: 999px; white-space: nowrap }
.st-Approved { background: var(--ok-bg); color: var(--ok) }
.st-Shortlisted { background: var(--warn-bg); color: var(--warn) }
.st-Candidate { background: var(--new-bg); color: var(--new) }
.note { font-size: .8rem; color: var(--muted); margin: 0 }

@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out } @keyframes slide { from { transform: translateX(24px); opacity: .6 } } }
@media (max-width: 520px) { .canvas { padding: 16px 8px } }
</style>

<header class="top">
  <div class="wrap">
    <div class="head-row">
      <h1>Senior Dev Agents</h1>
      <span class="counts" id="counts"></span>

<main class="wrap">

<div class="scrim" id="scrim" hidden></div>

  <div class="d-body" id="dBody"></div>
</aside>

dency for known advisories and supply-chain risk.","s":"Candidate"},{"n":"SkillSpector","d":"Scans agent skills for malicious or risky code before you install them.","s":"Candidate"}]},{"t":"DevSecOps Engineer","skills":[{"n":"agentic-actions-auditor","d":"Audits GitHub Actions that run AI agents for security holes.","s":"Candidate"},{"n":"claude-code-security-review","d":"GitHub Action that reviews every pull request for vulnerabilities.","s":"Candidate"}]},{"t":"Security Officer","skills":[{"n":"git-guardrails-claude-code","d":"Blocks dangerous git commands like force-push and reset --hard (hook).","s":"Shortlisted"}]}]}]},{"id":"devops","name":"DevOps & Release","does":"Ships it safely and keeps it running.","leads":[{"n":"Jerome Salazar","t":"DevOps Lead","skills":[{"n":"ci-cd-and-automation","d":"Sets up build, test and deploy pipelines.","s":"Shortlisted"},{"n":"deployment-patterns","d":"Deployment patterns and rollouts.","s":"Shortlisted"}],"staff":[{"t":"DevOps Engineer","skills":[{"n":"git-workflow-and-versioning","d":"Clean branches, commits and merges.","s":"Shortlisted"},{"n":"caveman-commit","d":"Writes short, clear commit messages.","s":"Approved"},{"n":"docker-patterns","d":"Docker and Compose setup, including container security.","s":"Shortlisted"}]},{"t":"Cloudflare Deploy Engineer","skills":[{"n":"wrangler","d":"Runs Cloudflare's deploy tool for local dev, previews and releases.","s":"Candidate"},{"n":"cloudflare-app-bootstrap","d":"Wires a new Workers app's database, secrets and data until it runs.","s":"Candidate"}]},{"t":"Mobile Pipeline Engineer","skills":[{"n":"eas-workflows","d":"Writes the build-and-release pipeline for the mobile app.","s":"Candidate"}]},{"t":"Site Reliability Engineer","skills":[{"n":"observability-and-instrumentation","d":"Adds logging, metrics, tracing and alerts so production issues are visible.","s":"Shortlisted"},{"n":"workers-profiling","d":"Finds slow or memory-hungry code in live Cloudflare Workers.","s":"Candidate"}]},{"t":"Release Manager","skills":[{"n":"shipping-and-launch","d":"Pre-launch checklist and safe production release.","s":"Shortlisted"}]}]}]},{"id":"leadership","name":"Engineering Leadership","does":"Sets standards, reviews code and keeps every agent on the same rules.","leads":[{"n":"Ramon Villareal","t":"Head of Engineering","skills":[{"n":"bmad-code-review","d":"Several reviewers check a change in parallel, then findings are triaged.","s":"Approved"},{"n":"code-reviewer","d":"Reviews changes for correctness, readability, architecture, security and performance.","s":"Shortlisted"}],"staff":[{"t":"Lead Reviewer","skills":[{"n":"caveman-review","d":"Short code review: one line per finding with location and fix.","s":"Approved"},{"n":"bmad-review","d":"Adversarial review of a draft or plan: edge cases, gaps, structure.","s":"Approved"},{"n":"bmad-walkthrough","d":"Guides a human through reviewing a commit, PR or folder.","s":"Approved"}]},{"t":"Tech Lead","skills":[{"n":"bmad-project-context","d":"Sets up and maintains the AGENTS.md rules every agent follows in a repo.","s":"Approved"},{"n":"context-engineering","d":"Keeps agent context and rules files lean so output stays sharp.","s":"Shortlisted"}]},{"t":"Technical Writer","skills":[{"n":"documentation-and-adrs","d":"Records decisions (ADRs) and flags docs that drift from the code.","s":"Shortlisted"}]},{"t":"Engineering Manager","skills":[{"n":"bmad-retrospective","d":"Reviews a finished epic and writes lessons learned.","s":"Approved"}]}]}]}];
const PERSON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
const BUILD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5M8 8h2M14 8h2M8 12h2M14 12h2"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('');
const nLeads = DATA.reduce((a, d) => a + d.leads.length, 0);
const nStaff = DATA.reduce((a, d) => a + d.leads.reduce((b, l) => b + l.staff.length, 0), 0);
document.getElementById('counts').textContent = `${DATA.length} departments · ${nLeads} leads · ${nStaff} specialist agents`;

const reg = []; // registry of clickable people
function addReg(o) { reg.push(o); return reg.length - 1 }

function leadUnit(dept, l) {
  const li = addReg({ kind: 'lead', name: l.n, role: l.t, dept: dept.name, reports: 'IT Department', skills: l.skills, staff: l.staff });
  const staff = l.staff.map(s => {
    const i = addReg({ kind: 'staff', name: s.t, role: s.t, dept: dept.name, reports: `${l.n} (${l.t})`, skills: s.skills });
    return `<li><button class="node n-staff" data-i="${i}" type="button"><span class="photo">${PERSON}</span><span class="txt"><span class="rl">${esc(s.t)}</span><span class="sk">${s.skills.length} skill${s.skills.length > 1 ? 's' : ''}</span></span></button></li>`;
  }).join('');
  return `<li><div class="unit"><button class="node n-lead" data-i="${li}" type="button"><span class="photo">${initials(l.n)}</span><span class="nm">${esc(l.n)}</span><span class="rl">${esc(l.t)}</span></button><ul class="staff">${staff}</ul></div></li>`;
}
function deptNode(d) {
  const i = addReg({ kind: 'dept', name: d.name + ' Department', role: d.does, dept: d.name, leads: d.leads });
  return `<li><button class="node n-dept" data-i="${i}" type="button"><span class="photo">${BUILD}</span><span class="nm">${esc(d.name)}</span><span class="rl">${d.leads.length} lead${d.leads.length > 1 ? 's' : ''} · ${d.leads.reduce((a, l) => a + l.staff.length, 0)} specialists</span></button><ul>${d.leads.map(l => leadUnit(d, l)).join('')}</ul></li>`;
}
function rootNode(inner) {
  const i = addReg({ kind: 'root', name: 'IT Department', role: 'Senior Dev Agents', dept: '' });
  return `<ul><li><button class="node n-root" data-i="${i}" type="button"><span class="photo">${BUILD}</span><span class="nm">IT Department</span><span class="rl">Senior Dev Agents</span></button><ul>${inner}</ul></li></ul>`;
}

const tree = document.getElementById('tree'), canvas = document.getElementById('canvas'), dir = document.getElementById('dir');
let zoomMode = 'fit';
function applyZoom() {
  tree.style.zoom = 1;
  const w = tree.scrollWidth, avail = canvas.clientWidth - 32;
  const z = zoomMode === 'fit' ? Math.min(1, avail / w) : 1;
  tree.style.zoom = z;
  document.getElementById('zFit').setAttribute('aria-pressed', zoomMode === 'fit');
  document.getElementById('z100').setAttribute('aria-pressed', zoomMode === '100');
}
document.getElementById('zFit').onclick = () => { zoomMode = 'fit'; applyZoom() };
document.getElementById('z100').onclick = () => { zoomMode = '100'; applyZoom() };
addEventListener('resize', applyZoom);

const tabs = document.getElementById('tabs');
tabs.innerHTML = `<button class="tab" role="tab" data-v="all" type="button">Whole company</button>` + DATA.map(d => `<button class="tab" role="tab" data-v="${d.id}" type="button">${esc(d.name)}</button>`).join('');
tabs.onclick = e => { const b = e.target.closest('.tab'); if (b) location.hash = b.dataset.v === 'all' ? '' : b.dataset.v; if (b && b.dataset.v === 'all') render('all') };

function chipList(skills) { return `<div class="chips">${skills.map(s => `<span class="chip c-${s.s}">${esc(s.n)}</span>`).join('')}</div>` }

function render(view) {
  reg.length = 0;
  tabs.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === view));
  const intro = document.getElementById('introText');
  if (view === 'all') {
    tree.innerHTML = rootNode(DATA.map(deptNode).join(''));
    intro.textContent = 'The whole team, from scoping to release. Click any box to see that agent’s skills. Pick a department above for a closer view.';
    dir.hidden = true; zoomMode = 'fit';
  } else {
    const d = DATA.find(x => x.id === view);
    tree.innerHTML = rootNode(deptNode(d));
    intro.textContent = d.does + ' Click any box for skill details.';
    dir.innerHTML = `<div><h2>${esc(d.name)} agents and skills</h2><p class="sub">Purple skills are candidates you haven’t approved yet.</p></div>` +
      d.leads.map(l => {
        const lead = reg.findIndex(r => r.kind === 'lead' && r.name === l.n);
        return `<div class="team"><div class="team-head"><b>${esc(l.n)}</b><span>${esc(l.t)}</span></div><div class="agents">` +
          `<button class="agent" data-i="${lead}" type="button"><span class="rl">${esc(l.t)} (lead)</span>${chipList(l.skills)}</button>` +
          l.staff.map(s => { const i = reg.findIndex(r => r.kind === 'staff' && r.name === s.t && r.dept === d.name); return `<button class="agent" data-i="${i}" type="button"><span class="rl">${esc(s.t)}</span>${chipList(s.skills)}</button>` }).join('') +
          `</div></div>`;
      }).join('');
    dir.hidden = false; zoomMode = 'fit';
  }
  applyZoom();
  const active = tabs.querySelector('[aria-selected="true"]'); if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function skillCard(s) { return `<div class="skill"><div class="top"><code>${esc(s.n)}</code><span class="st st-${s.s}">${s.s}</span></div><p>${esc(s.d)}</p></div>` }
function open(i) {
  const r = reg[i]; if (!r) return;
  const ph = document.getElementById('dPhoto');
  ph.innerHTML = r.kind === 'lead' ? initials(r.name) : (r.kind === 'staff' ? PERSON : BUILD);
  document.getElementById('dTitle').textContent = r.name;
  let sub = '', body = '';
  if (r.kind === 'lead') {
    sub = `${r.role} · ${r.dept}`;
    body = `<p class="d-label">Lead skills</p>${r.skills.map(skillCard).join('')}<p class="d-label">Team</p>${chipList(r.staff.map(s => ({ n: s.t, s: '' })))}`;
  } else if (r.kind === 'staff') {
    sub = `${r.dept} · reports to ${r.reports}`;
    body = `<p class="d-label">Skills</p>${r.skills.map(skillCard).join('')}`;
  } else if (r.kind === 'dept') {
    sub = r.role;
    body = r.leads.map(l => `<p class="d-label">${esc(l.n)} · ${esc(l.t)}</p>${chipList(l.staff.map(s => ({ n: s.t, s: '' })))}`).join('');
  } else {
    sub = `${DATA.length} departments · ${nLeads} leads · ${nStaff} specialist agents`;
    body = `<p class="note">Every agent follows caveman as the company standard: short answers and small, safe changes. Nothing is installed yet. Photos come later.</p>`;
  }
  if (r.kind === 'lead' || r.kind === 'staff') body += `<p class="note">Also follows caveman, the company standard for every agent.</p>`;
  document.getElementById('dSub').textContent = sub;
  document.getElementById('dBody').innerHTML = body;
  drawer.hidden = false; scrim.hidden = false; document.getElementById('dClose').focus();
}
function close() { drawer.hidden = true; scrim.hidden = true }
document.addEventListener('click', e => { const n = e.target.closest('[data-i]'); if (n) open(+n.dataset.i) });
document.getElementById('dClose').onclick = close; scrim.onclick = close;
addEventListener('keydown', e => { if (e.key === 'Escape') close() });

function route() { const h = location.hash.slice(1); render(DATA.some(d => d.id === h) ? h : 'all') }
addEventListener('hashchange', route);
route();
</script>
